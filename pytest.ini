[pytest]
testpaths = tests
addopts = --cov=src --cov-report=term-missing --cov-report=html:htmlcov -v --strict-markers
markers =
    ml: needs scikit-learn (skipped automatically when it is not installed)
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Qt UI deprecated and removed — no --ignore flags needed
