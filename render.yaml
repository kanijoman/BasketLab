# Render configuration-as-code
# Docs: https://render.com/docs/yaml-spec
#
# On first deploy, create the service manually on Render and link the repo.
# After that, this file keeps the service config in sync with the codebase.

services:
  - type: web
    name: basketlab-api
    runtime: python
    region: frankfurt  # closest to Spain
    plan: free

    buildCommand: pip install -r requirements.txt

    # run_api.py reads PORT from env (injected by Render) and ENVIRONMENT
    startCommand: python run_api.py

    # Health check — Render uses this to know when the app is ready
    healthCheckPath: /docs

    envVars:
      - key: ENVIRONMENT
        value: production

      # Set these in the Render dashboard (mark as secret):
      - key: MONGODB_CONNECTION_STRING
        sync: false   # must be set manually in Render dashboard

      - key: ALLOWED_ORIGINS
        sync: false   # set to Vercel URL after first Vercel deploy

      # Protects DELETE collections / scrape / ingest / train. Deliberately NOT set for now:
      # in production those endpoints answer 503. How to enable it: docs/OPERATIONS.md.
      # Use the SAME value on both services.
      - key: ADMIN_API_KEY
        sync: false

      # Prevent OOM during scraping — the dedicated scraper service handles ingestion
      - key: DISABLE_SCRAPING
        value: "1"

  # ---------------------------------------------------------------------------
  # Scraper service — minimal app (scrape + collections only, no ML deps loaded)
  # Runs on a separate Render instance to keep RAM usage low during ingestion.
  # ---------------------------------------------------------------------------
  - type: web
    name: basketlab-scraper
    runtime: python
    region: frankfurt
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: python run_scraper.py

    healthCheckPath: /docs

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: MONGODB_CONNECTION_STRING
        sync: false   # must be set manually in Render dashboard

      - key: ALLOWED_ORIGINS
        sync: false   # set to Vercel URL after first deploy

      - key: ADMIN_API_KEY
        sync: false   # same value as basketlab-api (protects DELETE collections / scrape)
