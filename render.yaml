# Render configuration-as-code
# Docs: https://render.com/docs/yaml-spec
#
# On first deploy, create the service manually on Render and link the repo.
# After that, this file keeps the service config in sync with the codebase.

services:
  - type: web
    name: basketlab-api
    runtime: python
    region: frankfurt  # closest to Spain
    plan: free

    buildCommand: pip install --no-cache-dir -r requirements.txt

    # run_api.py reads PORT from env (injected by Render) and ENVIRONMENT
    startCommand: python run_api.py

    # Health check — Render uses this to know when the app is ready
    healthCheckPath: /docs

    envVars:
      - key: ENVIRONMENT
        value: production

      # Set these in the Render dashboard (mark as secret):
      - key: MONGODB_CONNECTION_STRING
        sync: false   # must be set manually in Render dashboard

      - key: ALLOWED_ORIGINS
        sync: false   # set to Vercel URL after first Vercel deploy

      # Protects the training endpoints of the predictive analysis (kept, out of the web while it is reworked). Deliberately NOT set:
      # in production they answer 503. How to enable it: docs/OPERATIONS.md.
      - key: ADMIN_API_KEY
        sync: false

      # --- Memory (Render free plan = 512 MB) ---
      # One uvicorn worker: each one imports the whole app (~170 MB at idle).
      - key: WEB_CONCURRENCY
        value: "1"
      # Fewer glibc malloc arenas: far less memory fragmentation in a threaded app.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Set to 1 temporarily to log requests that grow RSS (see docs/OPERATIONS.md).
      - key: LOG_MEMORY
        value: "0"

