# Weekly dependency updates (issue #525). Security fixes of Dependabot arrive as separate PRs at any time; these are the routine ones, grouped so the CI
# (≈ 10 min) runs once per ecosystem and not once per package. Major versions are not proposed: they are done on purpose (see docs/OPERATIONS.md).
# ``rebase-strategy: disabled``: a PR is not rebased every time main moves (each rebase runs the whole CI again); ask for it with «@dependabot rebase» when it is going to be merged.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    groups:
      frontend-minor-and-patch: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major"] }

  - package-ecosystem: "npm"
    directory: "/apps/live-android"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    groups:
      live-app-minor-and-patch: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major"] }
      - { dependency-name: "pyodide" }        # pinned: the engine of the tablet runs on it and the vectors are measured with it; a change is made on purpose

  # requirements.txt uses open ranges (>=): CI and Render already install the latest, so a version PR would only raise a minimum. Only security updates (limit 0 = no version PRs).
  - package-ecosystem: "pip"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 2
    rebase-strategy: "disabled"
    groups:
      actions: { patterns: ["*"], update-types: ["minor", "patch"] }
