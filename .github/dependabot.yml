# Weekly dependency updates (issue #525). Security fixes of Dependabot arrive as separate PRs at any time; these are the routine ones, grouped so the CI
# (≈ 10 min) runs once per ecosystem and not once per package. Major versions are not proposed: they are done on purpose (see docs/OPERATIONS.md).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 3
    groups:
      frontend-minor-and-patch: { update-types: ["minor", "patch"] }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major"] }

  - package-ecosystem: "npm"
    directory: "/apps/live-android"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 3
    groups:
      live-app-minor-and-patch: { update-types: ["minor", "patch"] }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major"] }
      - { dependency-name: "pyodide" }        # pinned: the engine of the tablet runs on it and the vectors are measured with it; a change is made on purpose

  - package-ecosystem: "pip"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch: { update-types: ["minor", "patch"] }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major"] }

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 2
    groups:
      actions: { update-types: ["minor", "patch"] }
