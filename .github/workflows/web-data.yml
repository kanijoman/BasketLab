name: Web data

# Publishes what the web reads (issue #328, #640) to the `web-data` branch, served through raw.githubusercontent.com (CORS open, no
# credentials): the rows of the contract and the team reports of every competition, sealed by scope, plus the manifest `index.json`
# (`run_web_data.py`, `src/local_data/web_data.py`). Starts from the previous publication so that what did not change keeps its bytes
# (sealing is random; a file never changes in place). The branch is rewritten with a single commit (no history growth) and only when something changed.
#
# Source of the games (issues #646, #724): with the secret ARCHIVE_DEPLOY_KEY the job downloads the private archive (repository `basketlab-archive`), restores it into an
# ephemeral Mongo (service container) and builds the artifacts from there. It does NOT scrape or save the archive: `archive-refresh.yml` does that (minutes), is the only
# writer of the archive and runs first. Without the secret it reads Atlas as before (until Atlas is retired).
# Runs after each archive refresh or purge (even a red one: missing matches must not block the data; a cancelled one does) and by hand. Needs PACKAGE_MASTER_KEY (or
# PACKAGE_PASSWORD, >= 8 characters), and ATLAS_READ_URI (ATLAS_WRITE_URI as fallback; only without the archive). See docs/OPERATIONS.md.

on:
  workflow_run:
    workflows: ["Archive refresh", "Archive purge"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "run_web_data.py"
      - "run_archive.py"
      - "src/local_data/**"
      - "src/live_prep/scouting_*.py"
      - "src/services/scouting_rival_service.py"
      - "config/competitions.json"
      - ".github/workflows/web-data.yml"

permissions:
  contents: write

concurrency:
  group: web-data
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish the web data
    # a red archive refresh (missing matches) must not block the data; a cancelled one does
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120   # #700: the first build after a change of code computes every competition again (about 50 minutes); the rest reuse what did not change
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      EPHEMERAL_MONGO: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate the entry points (pull requests)
        if: github.event_name == 'pull_request'
        run: python -c "import run_web_data, run_archive; from src.local_data.web_data import publish_web_data; from src.services.atlas_refresh import load_config; print(len(load_config('config/competitions.json')), 'competitions')"
      - name: Choose the source of the games
        id: source
        if: github.event_name != 'pull_request'
        env:
          ARCHIVE_DEPLOY_KEY: ${{ secrets.ARCHIVE_DEPLOY_KEY }}
        run: |
          if [ -n "$ARCHIVE_DEPLOY_KEY" ]; then echo "archive=true" >> "$GITHUB_OUTPUT"; else echo "archive=false" >> "$GITHUB_OUTPUT"; fi
      - name: Download the archive
        id: pull
        if: steps.source.outputs.archive == 'true'
        env:
          ARCHIVE_DEPLOY_KEY: ${{ secrets.ARCHIVE_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # The secret was saved by hand: whatever it arrived with (CRLF, BOM, spaces for newlines...) the key is rebuilt from its base64 body
          printf '%s' "$ARCHIVE_DEPLOY_KEY" | python -m src.local_data.ssh_key > ~/.ssh/archive_key || { echo "::error::ARCHIVE_DEPLOY_KEY does not contain an OpenSSH private key (see above how the text looks; save it again from the file as is)"; exit 1; }
          chmod 600 ~/.ssh/archive_key
          ssh-keygen -y -f ~/.ssh/archive_key > /dev/null || { echo "::error::ARCHIVE_DEPLOY_KEY has the shape of a key but OpenSSH cannot read it (a passphrase? it must have none)"; exit 1; }
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/archive_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/archive_key -o IdentitiesOnly=yes"
          python run_archive.py pull --repo "git@github.com:${{ github.repository_owner }}/basketlab-archive.git" --dir archive
      - name: Restore the archive into the ephemeral Mongo
        id: restore
        if: steps.pull.outcome == 'success'
        env:
          MONGODB_CONNECTION_STRING: ${{ env.EPHEMERAL_MONGO }}
        run: python run_archive.py load --src archive --replace
      - name: Start from the previous publication
        if: github.event_name != 'pull_request'
        run: |
          git clone -q --depth 1 --branch web-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" web-out || mkdir web-out
      - name: Build the artifacts
        if: github.event_name != 'pull_request'
        env:
          MONGODB_CONNECTION_STRING: ${{ steps.source.outputs.archive == 'true' && env.EPHEMERAL_MONGO || secrets.ATLAS_READ_URI || secrets.ATLAS_WRITE_URI }}
          PACKAGE_MASTER_KEY: ${{ secrets.PACKAGE_MASTER_KEY || secrets.PACKAGE_PASSWORD }}
        run: python run_web_data.py --out web-out
      - name: Publish to the web-data branch
        if: ${{ !cancelled() && github.event_name != 'pull_request' && hashFiles('web-out/index.json') != '' }}
        run: |
          cd web-out
          [ -d .git ] || git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git rev-parse -q --verify HEAD >/dev/null && git diff --cached --quiet; then
            echo "Nothing changed: the branch stays as it is"
            exit 0
          fi
          git checkout -q --orphan publish
          git commit -q -m "Web data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" publish:web-data
