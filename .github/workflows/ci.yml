name: CI / Deploy

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:     # a manual run measures the coverage too (it checks the combination of the shares before it reaches main)

# A newer push to a pull request cancels the run of the previous commit (issue #741); a run of main is never cancelled (its deploy waits for the tests).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Backend tests ──────────────────────────────────────────────────────────
  # The suite is the longest job of an integration (issue #741), so it is split into SHARES that run as parallel jobs: `pytest-split` hands each share the tests that
  # add up to a quarter of the time stored in `.test_durations`, and inside a share pytest-xdist uses every CPU of the runner (4). `worksteal` hands tests out one by one
  # and lets an idle worker take them from a busy one (`loadscope` pinned a module to a worker). `--durations` lists the slowest tests of every run.
  # `.test_durations` must cover 95 % of the test modules (tests/test_ci_speed.py). When it does not, `python scripts/store_missing_durations.py` stores only the missing modules (it merges into the file, #866);
  # recalibrate everything only when the suite changes a lot: `python -m pytest tests -n auto --store-durations --durations-path=.test_durations`.
  # `python -m pytest` (not `pytest`) keeps the repo root on sys.path: some tests import `from tests.x import y`. Override addopts to skip the HTML coverage report.
  # Tests use mongomock (no real DB); ENVIRONMENT=development so db_config does not raise on a missing Atlas URL.
  # The coverage is only measured on main or in a manual run (`workflow_dispatch`), where the tracing cost does not delay a pull request; each share saves its data and the
  # gate job below combines them.
  backend-shard:
    name: Backend share ${{ matrix.group }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    env:
      WITH_COVERAGE: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run this share of the tests (no coverage outside main)
        if: env.WITH_COVERAGE != 'true'
        run: python -m pytest tests/ --splits 4 --group ${{ matrix.group }} --durations-path .test_durations --splitting-algorithm least_duration -n auto --dist worksteal --durations=30 --durations-min=1 --tb=short -q --override-ini='addopts='
        env:
          ENVIRONMENT: development

      - name: Run this share of the tests and keep its coverage data (main)
        if: env.WITH_COVERAGE == 'true'
        run: python -m pytest tests/ --splits 4 --group ${{ matrix.group }} --durations-path .test_durations --splitting-algorithm least_duration -n auto --dist worksteal --durations=30 --durations-min=1 --cov=src --cov-report= --tb=short -q --override-ini='addopts='
        env:
          ENVIRONMENT: development
          COVERAGE_FILE: .coverage.share${{ matrix.group }}

      - name: Upload the coverage data of this share (main)
        if: ${{ !cancelled() && env.WITH_COVERAGE == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.group }}
          path: .coverage.share${{ matrix.group }}
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # The check that the ruleset of main requires (`Backend (pytest)`): it passes only if every share passed (a skipped or cancelled share is not a pass) and, when the coverage
  # was measured, combines the data of the shares and applies the gate (82 %).
  test-backend:
    name: Backend (pytest)
    needs: backend-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      WITH_COVERAGE: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Every share passed
        run: |
          if [ "${{ needs.backend-shard.result }}" != "success" ]; then
            echo "::error::The backend shares finished as: ${{ needs.backend-shard.result }}"
            exit 1
          fi

      - uses: actions/checkout@v7
        if: env.WITH_COVERAGE == 'true'

      - uses: actions/setup-python@v7
        if: env.WITH_COVERAGE == 'true'
        with:
          python-version: "3.11"

      - name: Download the coverage data of the shares
        if: env.WITH_COVERAGE == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine the coverage and apply the gate (82 %)
        if: env.WITH_COVERAGE == 'true'
        run: |
          pip install -q coverage
          coverage combine .coverage.share1 .coverage.share2 .coverage.share3 .coverage.share4
          coverage report --fail-under=82

  # ── Frontend tests ─────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend (vitest + type-check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Lint (errors fail; warnings are tracked debt)
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm run test:run

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Build BasketLab Talent (second entry, #877)
        working-directory: frontend
        run: npm run build:market

  # ── Web smoke e2e (issue #111) ─────────────────────────────────────────────
  # Real Chromium against the production build and the real FastAPI app on an in-memory MongoDB
  # (tests/e2e_web/serve_api.py): no credentials, no network.
  e2e-web:
    name: Web smoke e2e (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Smoke e2e
        working-directory: frontend
        run: npm run e2e:ci

      # captures of the key pages in both themes and three widths (issue #197): not compared yet, kept to review a change of look in the pull request
      - name: Upload the captures of the pages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-visual-captures
          path: frontend/test-results/**/*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-results
          path: frontend/test-results
          retention-days: 7

  # ── Red proof (informative, issues #542 and #610) ──────────────────────────
  # The tests that a pull request adds or changes must FAIL on the source of its base (CLAUDE.md: write the failing test first): pytest, and the vitest of the web
  # and of the live app. It never blocks a merge or a deploy: the summary of the run says whether there is proof. ``continue-on-error`` keeps a failure of the
  # script itself from turning the check red. Only the suites with new tests get their dependencies installed.
  red-proof:
    name: Red proof of the new tests
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Which suites have new tests?
        id: suites
        run: python scripts/red_proof.py --base origin/${{ github.base_ref }} --needs >> "$GITHUB_OUTPUT"

      - name: Install the backend dependencies
        if: steps.suites.outputs.python == 'true'
        run: pip install -r requirements-dev.txt

      - name: Set up Node
        if: steps.suites.outputs.web == 'true' || steps.suites.outputs.app == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            apps/live-android/package-lock.json

      - name: Install the web dependencies
        if: steps.suites.outputs.web == 'true'
        working-directory: frontend
        run: npm ci

      - name: Install the live app dependencies
        if: steps.suites.outputs.app == 'true'
        working-directory: apps/live-android
        run: npm ci

      - name: Do the new tests fail on the base?
        run: python scripts/red_proof.py --base origin/${{ github.base_ref }}

  # Baseline of the duplicated code (issue #452) in the summary of every run; it never blocks a merge or a deploy and nothing waits for it.
  duplicate-code:
    name: Duplicate code report
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Report the duplicated blocks
        run: python scripts/duplicate_code.py

  # ── Deploy to Vercel (frontend) ────────────────────────────────────────────
  # Vercel auto-deploys via its native GitHub integration.
  # No explicit job needed here — Vercel listens to the repo directly.
  # The native integration also creates preview URLs for each PR automatically.
