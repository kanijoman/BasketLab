name: CI / Deploy

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Backend tests ──────────────────────────────────────────────────────────
  test-backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # Override addopts to skip HTML coverage report in CI (saves ~15s).
        # Use single-quoted override-ini to avoid bash quoting issues.
        run: python -m pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=70 --tb=short -q --override-ini='addopts='
        env:
          # Tests use mongomock — no real DB needed.
          # Set ENVIRONMENT to development so db_config doesn't raise on missing Atlas URL.
          ENVIRONMENT: development

  # ── Frontend tests ─────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend (vitest + type-check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Lint (errors fail; warnings are tracked debt)
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm run test:run

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── Web smoke e2e (issue #111) ─────────────────────────────────────────────
  # Real Chromium against the production build and the real FastAPI app on an in-memory MongoDB
  # (tests/e2e_web/serve_api.py): no credentials, no network.
  e2e-web:
    name: Web smoke e2e (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Smoke e2e
        working-directory: frontend
        run: npm run e2e:ci

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-results
          path: frontend/test-results
          retention-days: 7

  # ── Deploy to Render (backend) ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy → Render
    needs: [test-backend, test-frontend, e2e-web]
    runs-on: ubuntu-latest
    # Only deploy on push to main (not PRs, not develop)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Each hook is optional: a missing secret skips that deploy with a warning instead of
    # failing the pipeline (see docs/OPERATIONS.md for how to create them).
    steps:
      - name: Trigger Render deploy hook (api)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret not set: skipping the basketlab-api deploy"
            exit 0
          fi
          curl -fsSL -X POST "$HOOK"

      - name: Trigger Render deploy hook (scraper)
        env:
          HOOK: ${{ secrets.RENDER_SCRAPER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_SCRAPER_DEPLOY_HOOK_URL secret not set: skipping the basketlab-scraper deploy"
            exit 0
          fi
          curl -fsSL -X POST "$HOOK"

      # The hook is asynchronous: wait until the API serves THIS commit and its database is connected.
      # Needs the repository variable RENDER_API_URL (public URL of basketlab-api); skipped without it.
      - uses: actions/checkout@v4
      - name: Post-deploy check (api)
        env:
          RENDER_API_URL: ${{ vars.RENDER_API_URL }}
        run: python3 scripts/post_deploy_check.py --sha "$GITHUB_SHA"

  # ── Deploy to Vercel (frontend) ────────────────────────────────────────────
  # Vercel auto-deploys via its native GitHub integration.
  # No explicit job needed here — Vercel listens to the repo directly.
  # The native integration also creates preview URLs for each PR automatically.
