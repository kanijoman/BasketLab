name: CI / Deploy

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Backend tests ──────────────────────────────────────────────────────────
  test-backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The suite is the longest job of an integration: it runs in parallel (pytest-xdist, one worker per CPU; the runner
      # has 4) instead of in a single process. `loadscope` keeps the tests of a module together so its module-scoped fixtures
      # are built once per worker. `python -m pytest` (not `pytest`) keeps the repo root on sys.path: some tests import
      # `from tests.x import y`. Override addopts to skip the HTML coverage report; single quotes avoid bash quoting issues.
      # Tests use mongomock (no real DB); ENVIRONMENT=development so db_config does not raise on a missing Atlas URL.
      - name: Run tests in parallel (no coverage outside main)
        if: github.ref != 'refs/heads/main'
        run: python -m pytest tests/ -n auto --dist loadscope --tb=short -q --override-ini='addopts='
        env:
          ENVIRONMENT: development

      # The coverage gate (82 %) is enforced on main, where the tracing cost does not delay a pull request.
      - name: Run tests in parallel with the coverage gate (main)
        if: github.ref == 'refs/heads/main'
        run: python -m pytest tests/ -n auto --dist loadscope --cov=src --cov-report=term-missing --cov-fail-under=82 --tb=short -q --override-ini='addopts='
        env:
          ENVIRONMENT: development

  # ── Frontend tests ─────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend (vitest + type-check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Lint (errors fail; warnings are tracked debt)
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm run test:run

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── Web smoke e2e (issue #111) ─────────────────────────────────────────────
  # Real Chromium against the production build and the real FastAPI app on an in-memory MongoDB
  # (tests/e2e_web/serve_api.py): no credentials, no network.
  e2e-web:
    name: Web smoke e2e (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Smoke e2e
        working-directory: frontend
        run: npm run e2e:ci

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-results
          path: frontend/test-results
          retention-days: 7

  # ── Red proof (informative, issue #542) ────────────────────────────────────
  # The tests that a pull request adds or changes must FAIL on the source of its base (CLAUDE.md: write the failing test first). It never blocks a merge or a deploy:
  # the summary of the run says whether there is proof. ``continue-on-error`` keeps a failure of the script itself from turning the check red.
  red-proof:
    name: Red proof of the new tests
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Do the new tests fail on the base?
        run: python scripts/red_proof.py --base origin/${{ github.base_ref }}

  # Baseline of the duplicated code (issue #452) in the summary of every run; it never blocks a merge or a deploy and nothing waits for it.
  duplicate-code:
    name: Duplicate code report
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Report the duplicated blocks
        run: python scripts/duplicate_code.py

  # ── Deploy to Render (backend) ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy → Render
    needs: [test-backend, test-frontend, e2e-web]
    runs-on: ubuntu-latest
    # Render's free plan may take 20-25 min to deploy (issue #269): the check waits up to 40 min.
    timeout-minutes: 60
    # A newer push cancels the run of an older commit that is still waiting (it shows grey, not red)
    concurrency:
      group: deploy-render
      cancel-in-progress: true
    # Only deploy on push to main (not PRs, not develop)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Each hook is optional: a missing secret skips that deploy with a warning instead of
    # failing the pipeline (see docs/OPERATIONS.md for how to create them).
    steps:
      - name: Trigger Render deploy hook (api)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret not set: skipping the basketlab-api deploy"
            exit 0
          fi
          curl -fsSL -X POST "$HOOK"

      - name: Trigger Render deploy hook (scraper)
        env:
          HOOK: ${{ secrets.RENDER_SCRAPER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_SCRAPER_DEPLOY_HOOK_URL secret not set: skipping the basketlab-scraper deploy"
            exit 0
          fi
          curl -fsSL -X POST "$HOOK"

      # The hook is asynchronous: wait until the API serves THIS commit and its database is connected.
      # Needs the repository variable RENDER_API_URL (public URL of basketlab-api); skipped without it.
      - uses: actions/checkout@v7
      - name: Post-deploy check (api)
        env:
          RENDER_API_URL: ${{ vars.RENDER_API_URL }}
          # lets the check ask GitHub whether a newer commit that contains this one is already deployed
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/post_deploy_check.py --sha "$GITHUB_SHA"

  # ── Deploy to Vercel (frontend) ────────────────────────────────────────────
  # Vercel auto-deploys via its native GitHub integration.
  # No explicit job needed here — Vercel listens to the repo directly.
  # The native integration also creates preview URLs for each PR automatically.
