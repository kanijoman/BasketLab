name: CI / Deploy

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Backend tests ──────────────────────────────────────────────────────────
  test-backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # Override addopts to skip HTML coverage report in CI (saves ~15s)
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --tb=short \
            -q \
            --override-ini="addopts="
        env:
          # Tests use mongomock — no real DB needed.
          # Set ENVIRONMENT to development so db_config doesn't raise on missing Atlas URL.
          ENVIRONMENT: development

  # ── Frontend tests ─────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend (vitest + type-check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Run tests
        working-directory: frontend
        run: npm run test:run

  # ── Deploy to Render (backend) ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy → Render
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    # Only deploy on push to main (not PRs, not develop)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy hook
        # Add RENDER_DEPLOY_HOOK_URL as a GitHub repository secret.
        # Get it from: Render dashboard → your service → Settings → Deploy Hook.
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  # ── Deploy to Vercel (frontend) ────────────────────────────────────────────
  # Vercel auto-deploys via its native GitHub integration.
  # No explicit job needed here — Vercel listens to the repo directly.
  # The native integration also creates preview URLs for each PR automatically.
