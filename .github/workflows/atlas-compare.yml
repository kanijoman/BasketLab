name: Atlas compare

# Is everything Atlas holds in the private archive? (issue #724, step 1 of switching Atlas off; docs/evaluaciones/2026-11-03_dependencia-de-atlas.md)
# READ ONLY on both sides: the archive is restored into an ephemeral Mongo and Atlas is read with `ATLAS_READ_URI` or, as in the other workflows, with
# ATLAS_WRITE_URI (Atlas is deprecated, decided 03/11/2026: no read-only user is created for it). Whatever the credential can do, the code only reads: the connection
# goes through a wrapper that raises on anything but a projected `find` (`src/local_data/atlas_compare.py`). Nothing is written anywhere: the archive is not pushed. The report goes to the run summary; the job is red if Atlas has games the archive lacks.
# Needs the repository secrets ARCHIVE_DEPLOY_KEY and ATLAS_WRITE_URI (or ATLAS_READ_URI). Runs by hand and on pull requests that touch it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "run_atlas_compare.py"
      - "src/local_data/atlas_compare.py"
      - ".github/workflows/atlas-compare.yml"

permissions:
  contents: read

jobs:
  compare:
    name: Archive against Atlas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      EPHEMERAL_MONGO: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore the archive
        uses: ./.github/actions/restore-archive
        with:
          deploy-key: ${{ secrets.ARCHIVE_DEPLOY_KEY }}
      - name: Compare with Atlas (read only)
        env:
          MONGODB_CONNECTION_STRING: ${{ env.EPHEMERAL_MONGO }}
          ATLAS_READ_URI: ${{ secrets.ATLAS_READ_URI || secrets.ATLAS_WRITE_URI }}
        run: python run_atlas_compare.py
