name: Rule evaluation

# Replays the games of a FEB competition as live from both teams through the alert engine and measures every rule
# (issue #238): alerts, duplicates, follow-up by the coach, outcome, coach behaviour. The recordings committed in
# tests/recordings replace the simulated feed of their match. By hand only: it reads the whole competition from the private archive (issue #724, step 4: only that collection is
# restored into an ephemeral Mongo by `.github/actions/restore-archive`, read only); without ARCHIVE_DEPLOY_KEY it reads Atlas as before (repository secret ATLAS_READ_URI,
# ATLAS_WRITE_URI as fallback) until Atlas is retired. The report goes to the run summary and to the
# `rule-evaluation` artifact (report.md, evaluation.json, alerts.jsonl). See docs/LIVE_RULES_CANDIDATES.md.

on:
  workflow_dispatch:
    inputs:
      collection:
        description: "MongoDB collection of the competition (e.g. FEB_LF_CHALLENGE_2026_2027)"
        required: true
        type: string
      team:
        description: "Evaluate only this team id (optional; every team still feeds the season)"
        required: false
        type: string
      min_prior_games:
        description: "Skip sides whose team has fewer earlier games"
        required: false
        default: "3"
        type: string
      roster:
        description: "Ask FEB for the current roster of every team (once each) so the illegal-lineup rule can be measured (#278)"
        required: false
        default: false
        type: boolean
      roster_file:
        description: "Roster file of the repository (JSON, the package's tables.roster); no network. Optional"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rule-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate the rules
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      EPHEMERAL_MONGO: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Choose the source of the games
        id: source
        env:
          ARCHIVE_DEPLOY_KEY: ${{ secrets.ARCHIVE_DEPLOY_KEY }}
        run: |
          if [ -n "$ARCHIVE_DEPLOY_KEY" ]; then echo "archive=true" >> "$GITHUB_OUTPUT"; else echo "archive=false" >> "$GITHUB_OUTPUT"; fi
      - name: Restore the archive
        if: steps.source.outputs.archive == 'true'
        uses: ./.github/actions/restore-archive
        with:
          deploy-key: ${{ secrets.ARCHIVE_DEPLOY_KEY }}
          collection: ${{ inputs.collection }}
      - name: Evaluate
        env:
          MONGODB_CONNECTION_STRING: ${{ steps.source.outputs.archive == 'true' && env.EPHEMERAL_MONGO || secrets.ATLAS_READ_URI || secrets.ATLAS_WRITE_URI }}
          COLLECTION: ${{ inputs.collection }}
          TEAM: ${{ inputs.team }}
          MIN_PRIOR_GAMES: ${{ inputs.min_prior_games }}
          ROSTER: ${{ inputs.roster }}
          ROSTER_FILE: ${{ inputs.roster_file }}
        run: |
          args=(--collection "$COLLECTION" --min-prior-games "${MIN_PRIOR_GAMES:-3}" --out rule-evaluation)
          if [ -n "$TEAM" ]; then args+=(--team "$TEAM"); fi
          if [ "$ROSTER" = "true" ]; then args+=(--roster); fi
          if [ -n "$ROSTER_FILE" ]; then args+=(--roster-file "$ROSTER_FILE"); fi
          for recording in tests/recordings/*.rec.json.gz; do args+=(--recording "$recording"); done
          python -m src.live_prep.rule_evaluation "${args[@]}"
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rule-evaluation
          path: rule-evaluation/
          if-no-files-found: ignore
          retention-days: 30
