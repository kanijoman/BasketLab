name: Live Android app

# apps/live-android: React + Vite app (src/live_core running in Pyodide inside a Web Worker)
# packaged with Capacitor. Everything is built and tested in the cloud: nothing needs to be
# installed locally. Tag `live-android-vX.Y.Z` to publish the APK as a GitHub Release. The weekly workflow
# (live-android-release.yml, issue #279) publishes by starting this one by hand with a version: a tag created with
# GITHUB_TOKEN would not start any workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (X.Y.Z): builds main, creates the tag live-android-vX.Y.Z and both releases"
        required: true
        type: string
      notes:
        description: "Short notes for the app's update notice (latest.json)"
        required: false
        type: string
        default: ""
      release_body:
        description: "Notes (Markdown) of the version release"
        required: false
        type: string
        default: ""
  push:
    branches: ["main"]
    tags: ["live-android-v*"]
    paths:
      - "apps/live-android/**"
      - "src/live_core/**"
      - "tests/live_vectors/**"
      - "src/JSON_samples/feb_game.json"
      - ".github/workflows/live-android.yml"
  pull_request:
    paths:
      - "apps/live-android/**"
      - "src/live_core/**"
      - "tests/live_vectors/**"
      - "src/JSON_samples/feb_game.json"
      - ".github/workflows/live-android.yml"

defaults:
  run:
    working-directory: apps/live-android

jobs:
  web:
    name: Web app (types, unit + Pyodide tests, build, e2e on a phone viewport)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/live-android/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests (engine on real Pyodide vs the reference vectors, worker client, UI)
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Install Chromium for the e2e tests
        run: npx playwright install --with-deps chromium

      - name: E2E (real browser, Web Worker, Pyodide, Pixel 7 viewport)
        run: npm run e2e:ci

      - name: Keep the failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: apps/live-android/test-results
          if-no-files-found: ignore

  apk:
    name: Android APK
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/live-android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # The version is fixed BEFORE the web build: the app shows it and compares it with the published one (issues #226,
      # #227). versionCode only has to grow with every release; the run number of the workflow does.
      - name: Version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          code="${{ github.run_number }}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # only main is ever published, and the version must look like one (it ends up in a tag and a file name)
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then echo "::error::Only main can be published"; exit 1; fi
            if ! [[ "$DISPATCH_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::The version must be X.Y.Z"; exit 1; fi
            name="$DISPATCH_VERSION"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME#live-android-v}"
          else
            name="0.1.0-${GITHUB_SHA::7}"
          fi
          {
            echo "APP_VERSION_CODE=$code"
            echo "APP_VERSION_NAME=$name"
            echo "VITE_APP_VERSION=$name"
            echo "VITE_APP_BUILD=$code"
            echo "VITE_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Build the web app and sync it into the Android project
        run: npm run cap:sync

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "mode=release-key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set: signing with a throw-away debug key (the APK installs, but a later build cannot update it; see docs/OPERATIONS.md)"
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "mode=debug-key" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble the release APK
        working-directory: apps/live-android/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/*.apk "dist-apk/basketlab-live-${APP_VERSION_NAME}.apk"
          # fixed name for the moving "live-android-latest" release (stable download link)
          cp android/app/build/outputs/apk/release/*.apk dist-apk/basketlab-live.apk
          # what the app reads to know whether a newer version is published (issue #227)
          jq -n --arg version "$APP_VERSION_NAME" --argjson code "$APP_VERSION_CODE" --arg built "$VITE_BUILT_AT" \
            --arg apk "https://github.com/${GITHUB_REPOSITORY}/releases/download/live-android-latest/basketlab-live.apk" \
            --arg notes "$NOTES" \
            '{version: $version, versionCode: $code, apk: $apk, notes: (if $notes == "" then null else $notes end), built_at: $built}' > dist-apk/latest.json
          cat dist-apk/latest.json
          ls -la dist-apk

      - uses: actions/upload-artifact@v4
        with:
          name: basketlab-live-apk
          path: apps/live-android/dist-apk/basketlab-live-*.apk

      - name: Publish a GitHub Release (tags and manual releases)
        if: startsWith(github.ref, 'refs/tags/live-android-v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: apps/live-android/dist-apk/basketlab-live-*.apk
          # a manual release creates its tag here, at the commit that was built
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('live-android-v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: BasketLab Live ${{ env.APP_VERSION_NAME }}
          # Prereleases are never the repo's "latest release" (make_latest:false alone is not enough:
          # GitHub would still pick the newest one); see docs/OPERATIONS.md
          prerelease: true
          body: |
            BasketLab Live ${{ env.APP_VERSION_NAME }} (${{ steps.signing.outputs.mode }}).
            Instalar: descargar el APK en el dispositivo y permitir "Instalar apps desconocidas" para el navegador/gestor de archivos.
            Si ya tienes la app con el botón de actualizar (desde la 0.3.0), basta con pulsarlo.

            ${{ inputs.release_body }}

      - name: Update the stable "live-android-latest" release (tags and manual releases)
        if: startsWith(github.ref, 'refs/tags/live-android-v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete live-android-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create live-android-latest dist-apk/basketlab-live.apk dist-apk/latest.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "BasketLab Live (última versión)" \
            --notes "Enlace fijo al APK más reciente: versión ${APP_VERSION_NAME} (${{ steps.signing.outputs.mode }}). Releases por versión: etiquetas live-android-v*."
