<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* The theme before the first paint (issue #188): the key and the default of src/lib/theme.ts (a test keeps them equal) */
      var t; try { t = localStorage.getItem('basketlab-web-theme') } catch (e) {}
      if (t !== 'dark' && t !== 'system') t = 'light'
      if (t !== 'system') document.documentElement.setAttribute('data-theme', t)
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BasketLab · Análisis de baloncesto</title>
    <meta name="description" content="Estadística avanzada de baloncesto de las ligas FEB y FBCYL: equipos, jugadoras, posesiones, quintetos, tiros, informes y preparación de partidos." />
    <meta name="theme-color" content="#f6f8fa" />
    <!-- icons and the image to share a link (issue #189): `npm run brand` writes them from design/brand -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BasketLab" />
    <meta property="og:title" content="BasketLab · Análisis de baloncesto" />
    <meta property="og:description" content="Estadística avanzada de las ligas FEB y FBCYL para cuerpos técnicos." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
